{% load static %}
<header class="z-10 py-4 bg-white shadow-md dark:bg-gray-800">
  <div class="container flex items-center justify-between h-full px-6 mx-auto">
    
    <!-- Mobile hamburger menu button -->
    <button
      class="p-1 mr-5 -ml-1 rounded-md md:hidden focus:outline-none focus:shadow-outline-purple text-gray-500"
      @click="toggleSideMenu"
      aria-label="Menu"
    >
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
      </svg>
    </button>

    <!-- Header Search Bar -->
    <div class="flex justify-start flex-1">
      <div class="relative w-full max-w-xl mr-6 text-purple-600 focus-within:text-purple-500">
        <div class="absolute inset-y-0 flex items-center pl-2">
          <svg class="w-4 h-4" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <input class="w-full pl-8 pr-2 text-sm text-gray-700 placeholder-gray-600 bg-gray-100 border-0 rounded-md dark:placeholder-gray-500 dark:focus:shadow-outline-gray dark:focus:placeholder-gray-400 dark:bg-gray-700 dark:text-gray-200 focus:placeholder-gray-500 focus:bg-white focus:border-purple-300 focus:outline-none focus:shadow-outline-purple form-input" type="text" placeholder="Buscar empleados, nóminas o novedades..." aria-label="Search" />
      </div>
    </div>
    
    <!-- Right-aligned Actions: Theme Toggler & User Profile (Glued to Right) -->
    <div class="flex items-center ml-auto space-x-4 select-none">
      <!-- Theme toggler -->
      <button class="p-2 rounded-lg text-gray-500 dark:text-gray-300 hover:text-purple-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors focus:outline-none" @click="toggleTheme" aria-label="Toggle color mode">
        <template x-if="!dark">
          <svg class="w-5 h-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
          </svg>
        </template>
        <template x-if="dark">
          <svg class="w-5 h-5" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 001.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1z" clip-rule="evenodd"></path>
          </svg>
        </template>
      </button>

      <!-- Profile Menu (Rightmost) -->
      <div class="relative" id="profileDropdownContainer">
        <button type="button" 
                id="profileBtn"
                onclick="toggleProfileDropdown(event)"
                @click="isProfileMenuOpen = !isProfileMenuOpen" 
                class="flex items-center gap-2.5 px-3 py-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700/80 transition-all border border-gray-200 dark:border-gray-700 focus:outline-none cursor-pointer" 
                aria-label="Account">
          {% if request.session.user_avatar %}
            <img id="headerUserAvatarImg" src="{{ request.session.user_avatar }}" class="w-8 h-8 rounded-full object-cover border-2 border-purple-500 shadow-sm" alt="Foto de Perfil">
          {% else %}
            <div id="headerUserAvatarDiv" class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-600 text-white font-bold flex items-center justify-center text-xs shadow-sm border border-purple-400">
              {% if request.session.user_email %}{{ request.session.user_email|first|upper }}{% else %}U{% endif %}
            </div>
          {% endif %}

          {% if request.session.user_email %}
             <span class="text-xs font-semibold text-gray-700 dark:text-gray-200 hidden sm:inline">{{ request.session.user_email }}</span>
          {% else %}
             <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 hidden sm:inline">Invitado / Anon</span>
          {% endif %}

          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <ul id="profileDropdownMenu"
            x-show="isProfileMenuOpen" 
            class="hidden absolute right-0 mt-2 w-52 p-2 space-y-1 text-gray-600 bg-white border border-gray-100 rounded-xl shadow-xl dark:border-gray-700 dark:text-gray-300 dark:bg-gray-800 z-50">
          {% if request.session.user_email or request.session.access_token %}
            <li>
              <button type="button" 
                      onclick="openAvatarModal(event)"
                      @click="isAvatarModalOpen = true; isProfileMenuOpen = false" 
                      class="flex items-center w-full px-3 py-2 text-xs font-semibold rounded-lg hover:bg-purple-50 hover:text-purple-700 dark:hover:bg-gray-700 dark:hover:text-purple-300 transition-colors text-left cursor-pointer">
                <svg class="w-4 h-4 mr-2.5 text-purple-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>📷 Cambiar Foto de Perfil</span>
              </button>
            </li>
            <li class="border-t border-gray-100 dark:border-gray-700 pt-1">
              <a href="{% url 'logout' %}" class="flex items-center w-full px-3 py-2 text-xs font-semibold rounded-lg text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-gray-700 transition-colors">
                <svg class="w-4 h-4 mr-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                </svg>
                <span>🚪 Cerrar Sesión</span>
              </a>
            </li>
          {% else %}
            <li>
              <a href="{% url 'login' %}" class="flex items-center w-full px-3 py-2 text-xs font-semibold text-purple-600 hover:bg-purple-50 dark:hover:bg-gray-700 rounded-lg">
                <span>🔑 Iniciar Sesión</span>
              </a>
            </li>
            <li>
              <a href="{% url 'signup' %}" class="flex items-center w-full px-3 py-2 text-xs font-semibold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                <span>📝 Registrarse</span>
              </a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </div>

  <!-- Modal Cambiar Foto de Perfil -->
  <div id="avatarModal" 
       x-show="isAvatarModalOpen" 
       class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm">
    <div onclick="event.stopPropagation()" class="w-full max-w-md p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 transition-all">
      <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-gray-700">
        <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
          <span>📷</span> Cambiar Foto de Perfil
        </h3>
        <button type="button" onclick="closeAvatarModal()" @click="isAvatarModalOpen = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-lg font-bold">&times;</button>
      </div>

      <form method="post" action="{% url 'cambiar_foto_perfil' %}" enctype="multipart/form-data" class="mt-4 space-y-4">
        {% csrf_token %}

        <!-- Preset Avatars selection -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">
            Elige un Avatar prediseñado:
          </label>
          <div class="grid grid-cols-5 gap-2">
            <button type="button" onclick="selectPresetAvatar('https://api.dicebear.com/7.x/bottts/svg?seed=Executive')" @click="selectedPreset = 'https://api.dicebear.com/7.x/bottts/svg?seed=Executive'" class="avatar-preset-btn p-1 rounded-xl border-2 border-gray-200 dark:border-gray-700 transition-all hover:scale-105">
              <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Executive" class="w-10 h-10 mx-auto pointer-events-none" alt="Avatar 1">
            </button>
            <button type="button" onclick="selectPresetAvatar('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix')" @click="selectedPreset = 'https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'" class="avatar-preset-btn p-1 rounded-xl border-2 border-gray-200 dark:border-gray-700 transition-all hover:scale-105">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="w-10 h-10 mx-auto pointer-events-none" alt="Avatar 2">
            </button>
            <button type="button" onclick="selectPresetAvatar('https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka')" @click="selectedPreset = 'https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka'" class="avatar-preset-btn p-1 rounded-xl border-2 transition-all hover:scale-105">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="w-10 h-10 mx-auto pointer-events-none" alt="Avatar 3">
            </button>
            <button type="button" onclick="selectPresetAvatar('https://api.dicebear.com/7.x/bottts/svg?seed=AdminBoss')" @click="selectedPreset = 'https://api.dicebear.com/7.x/bottts/svg?seed=AdminBoss'" class="avatar-preset-btn p-1 rounded-xl border-2 border-gray-200 dark:border-gray-700 transition-all hover:scale-105">
              <img src="https://api.dicebear.com/7.x/bottts/svg?seed=AdminBoss" class="w-10 h-10 mx-auto pointer-events-none" alt="Avatar 4">
            </button>
            <button type="button" onclick="selectPresetAvatar('https://api.dicebear.com/7.x/avataaars/svg?seed=Samantha')" @click="selectedPreset = 'https://api.dicebear.com/7.x/avataaars/svg?seed=Samantha'" class="avatar-preset-btn p-1 rounded-xl border-2 border-gray-200 dark:border-gray-700 transition-all hover:scale-105">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Samantha" class="w-10 h-10 mx-auto pointer-events-none" alt="Avatar 5">
            </button>
          </div>
        </div>

        <input type="hidden" id="inputAvatarUrl" name="avatar_url" value="">

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
          <span class="flex-shrink mx-3 text-xs text-gray-400 font-semibold">O sube desde tu equipo (Opcional)</span>
          <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
        </div>

        <!-- Subir imagen desde la computadora -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
            Archivo de imagen (PNG, JPG, SVG):
          </label>
          <input type="file" name="avatar_file" accept="image/*" class="block w-full text-xs text-gray-500 dark:text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 dark:file:bg-gray-700 dark:file:text-purple-300 border border-gray-200 dark:border-gray-700 rounded-lg p-1">
        </div>

        <!-- Botones de Acción -->
        <div class="flex justify-end gap-3 pt-3 border-t border-gray-100 dark:border-gray-700">
          <button type="button" onclick="closeAvatarModal()" @click="isAvatarModalOpen = false" class="px-4 py-2 text-xs font-semibold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 cursor-pointer">
            Cancelar
          </button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-purple-600 rounded-xl hover:bg-purple-700 shadow-md cursor-pointer">
            Guardar Foto
          </button>
        </div>
      </form>
    </div>
  </div>
</header>

<script>
  function toggleProfileDropdown(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('profileDropdownMenu');
    if (menu) {
      menu.classList.toggle('hidden');
    }
  }

  function openAvatarModal(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('profileDropdownMenu');
    if (menu) menu.classList.add('hidden');
    
    const modal = document.getElementById('avatarModal');
    if (modal) {
      modal.classList.remove('hidden');
      modal.style.display = 'flex';
    }
  }

  function closeAvatarModal() {
    const modal = document.getElementById('avatarModal');
    if (modal) {
      modal.classList.add('hidden');
      modal.style.display = 'none';
    }
  }

  function selectPresetAvatar(url) {
    const hiddenInput = document.getElementById('inputAvatarUrl');
    if (hiddenInput) {
      hiddenInput.value = url;
    }
    document.querySelectorAll('.avatar-preset-btn').forEach(btn => {
      btn.classList.remove('border-purple-600', 'bg-purple-50');
      btn.classList.add('border-gray-200', 'dark:border-gray-700');
    });
    if (event && event.currentTarget) {
      event.currentTarget.classList.add('border-purple-600', 'bg-purple-50');
      event.currentTarget.classList.remove('border-gray-200', 'dark:border-gray-700');
    }
  }

  // Close dropdown on outside click
  document.addEventListener('click', function(e) {
    const container = document.getElementById('profileDropdownContainer');
    const menu = document.getElementById('profileDropdownMenu');
    if (container && menu && !container.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });
</script>
